<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wx">
   <div class="in">
    <div class="top">
      <svg class="pin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s6.5-6.1 6.5-11.1A6.5 6.5 0 0 0 5.5 9.9C5.5 14.9 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="12" cy="9.7" r="2.35" fill="none" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <span class="city" id="place">济南市</span>
      <span class="sep">·</span>
      <span class="upd" id="updated">10:30 更新</span>
    </div>

    <!-- 第一行：状态 + 温度 + 最高最低 / 右侧大图标 -->
    <div class="head">
      <div class="hleft">
        <span class="hmain">
          <span class="tmp"><span class="num" id="temp">11</span><span class="deg">°</span></span>
          <span class="cond" id="cond">阴</span>
        </span>
        <span class="hl">
          <span class="hl-max"><span id="kMax">最高</span> <b id="tmax">11</b><i>°</i></span>
          <span class="hl-min"><span id="kMin">最低</span> <b id="tmin">7</b><i>°</i></span>
        </span>
      </div>
      <div class="hright">
        <span class="heroWrap" id="iconWrap"><img class="hero" id="icon" src="assets/cloudy.svg" alt=""></span>
        <span class="pop" id="pop"><span class="pk" id="kPop">降水概率</span> <b id="popValue">30%</b></span>
      </div>
    </div>

    <!-- 第二行：四项指标，撑满整宽 -->
    <div class="metrics">
      <div class="m">
        <span class="v" id="feels">8°C</span>
        <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2a2.4 2.4 0 0 1 2.4 2.4v6.1a4.1 4.1 0 1 1-4.8 0V6.6A2.4 2.4 0 0 1 12 4.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/></svg>
        <span class="k" id="kFeels">体感</span>
      </div>
      <div class="m">
        <span class="v" id="hum">65%</span>
        <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8c3.2 3.5 5.3 6.2 5.3 8.6a5.3 5.3 0 0 1-10.6 0c0-2.4 2.1-5.1 5.3-8.6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span class="k" id="kHum">湿度</span>
      </div>
      <div class="m">
        <span class="v" id="windLevel">2级</span>
        <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5h9.2a2.6 2.6 0 1 0-2.6-2.6M3.5 12.5h12.9a2.6 2.6 0 1 1-2.6 2.6M3.5 16.5h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="k" id="windDir">东北风</span>
      </div>
      <div class="m">
        <span class="v" id="airValue">60</span>
        <span class="lv" id="airLevel">良</span>
        <span class="k" id="airLabel">空气质量</span>
      </div>
    </div>

    <!-- 第三行：一周天气 -->
    <div class="week" id="week"></div>
   </div>

   <!-- 切城市：点顶部地名打开，模糊检索后点选 -->
   <div class="picker" id="picker" hidden>
     <div class="pbar">
       <svg class="pico" viewBox="0 0 24 24" aria-hidden="true">
         <circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
         <path d="M15.2 15.2 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
       </svg>
       <input id="pq" type="text" placeholder="输入城市名，如 滨州" autocomplete="off" spellcheck="false">
       <button id="pclose" class="pclose" type="button" aria-label="关闭">✕</button>
     </div>
     <div class="plist" id="plist"></div>
   </div>
  </div>
  <script src="cities.js"></script>
  <script src="main.js"></script>
</body>
</html>
